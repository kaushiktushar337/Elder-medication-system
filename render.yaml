services:
  - type: web
    name: elder-carecircle-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        sync: false
      - key: PROFILE_SETUP_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
